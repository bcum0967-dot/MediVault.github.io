<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vault</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#171717;--line:#303030;--text:#f1f1f1;--muted:#969696;--accent:#d7d7d7;--danger:#ff7777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit}button{border:1px solid var(--line);background:#202020;color:var(--text);padding:8px 11px;border-radius:7px;cursor:pointer}button:hover{background:#2a2a2a}button.primary{background:#ededed;color:#111;border-color:#ededed}button.primary:hover{background:#d4d4d4}button.danger{color:var(--danger)}button:focus-visible,input:focus-visible{outline:2px solid #aaa;outline-offset:2px}
header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px}.brand{font-weight:750;letter-spacing:-.4px;font-size:17px}.brand span{color:#777;font-weight:400}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main{max-width:1250px;margin:auto;padding:25px 24px 50px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}.left-tools,.right-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.crumb{color:var(--muted);display:flex;align-items:center;gap:7px}.crumb button{padding:3px 5px;background:transparent;border:0;color:var(--muted)}.crumb button:last-child{color:var(--text)}.search{background:#171717;border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:210px;color:var(--text)}.search::placeholder{color:#777}
h1{font-size:22px;letter-spacing:-.6px;margin:0 0 5px} .sub{color:var(--muted);font-size:12px;margin:0 0 22px}.section{margin:0 0 28px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}.section-head h2{font-size:13px;font-weight:650;margin:0;color:#c9c9c9}.section-head span{font-size:12px;color:var(--muted)}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:8px}.folder{min-width:0;display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}.folder:hover,.folder.selected{border-color:#777}.folder-icon{color:#aaa;font-size:17px}.folder-name{min-width:0;flex:1}.folder-name strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600}.folder-name small{color:var(--muted);font-size:11px}.folder-menu{padding:3px 7px;background:transparent;border-color:transparent;color:var(--muted)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}.file{min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:8px;overflow:hidden}.preview{height:130px;background:#202020;display:grid;place-items:center;position:relative;cursor:pointer;overflow:hidden}.preview img,.preview video{height:100%;width:100%;object-fit:cover}.file-icon{font-size:30px;color:#888}.play{position:absolute;bottom:7px;right:7px;background:#000b;border-radius:4px;padding:3px 6px;font-size:11px}.file-info{padding:10px}.filename{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:11px;color:var(--muted);margin-top:4px}.file-actions{display:flex;gap:6px;margin-top:9px}.file-actions button{font-size:11px;padding:5px 8px;flex:1}
.empty{grid-column:1/-1;color:var(--muted);border:1px dashed #383838;border-radius:8px;text-align:center;padding:32px 15px;font-size:13px}.empty strong{display:block;color:#ddd;font-weight:550;margin-bottom:4px}.hidden{display:none!important}
.backdrop{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(480px,100%);max-height:90vh;overflow:auto;background:#181818;border:1px solid #383838;border-radius:12px;padding:20px}.modal h2{font-size:18px;margin:0 0 5px}.modal p{font-size:12px;color:var(--muted);margin:0 0 15px}.modal label{display:block;color:#bbb;font-size:12px;margin:12px 0 5px}.modal input{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:#101010;color:var(--text)}.modal-actions{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap;margin-top:18px}.notice{font-size:11px;color:#aaa;background:#202020;padding:10px;border-radius:7px;margin-top:12px;line-height:1.5}.code{background:#101010;border:1px solid var(--line);border-radius:7px;padding:10px;font:11px/1.5 ui-monospace,monospace;overflow-wrap:anywhere;max-height:150px;overflow:auto}.viewer{width:min(1050px,100%);height:min(78vh,720px);display:grid;place-items:center;background:#080808;border-radius:7px;overflow:hidden}.viewer img,.viewer video{max-width:100%;max-height:100%;object-fit:contain}.viewer video{width:100%;height:100%}.viewer-head{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px}.viewer-head h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,12px);opacity:0;transition:.2s;background:#eee;color:#111;border-radius:7px;padding:9px 13px;z-index:9;pointer-events:none;max-width:90vw;text-align:center;font-size:12px}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){header{padding:0 14px;height:auto;min-height:60px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}main{padding:20px 14px}.actions{gap:5px}.actions button{padding:7px 9px}.search{width:145px}.folders{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.files{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}.preview{height:115px}}
</style>
</head>
<body>
<header><div class="brand">vault <span>/ media</span></div><div class="actions"><button id="takePhoto">Take photo</button><button id="recordVideo">Record video</button><button id="newFolder">New folder</button><button id="import">Import</button><button class="primary" id="upload">Upload files</button><input id="picker" type="file" accept="image/*,video/*" multiple hidden></div></header>
<main>
 <div class="toolbar"><div class="left-tools"><div class="crumb" id="crumb"><button data-root>All files</button></div><button data-view="all" class="view active">All</button><button data-view="image" class="view">Images</button><button data-view="video" class="view">Videos</button></div><div class="right-tools"><input class="search" id="search" placeholder="Search files" aria-label="Search files"></div></div>
 <section class="section" id="folderSection"><div class="section-head"><h2>FOLDERS</h2><span id="folderCount">0</span></div><div class="folders" id="folders"></div></section>
 <section class="section"><div class="section-head"><h2 id="filesTitle">FILES</h2><span id="fileCount">0 items</span></div><div class="files" id="files"></div></section>
 <p class="sub">Stored in this browser. Export folders to move or share their contents.</p>
</main>
<div class="backdrop hidden" id="backdrop"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const DB='media-vault-db',MEDIA='media',FOLDERS='folders';let db,folders=[],files=[],folderId=null,view='all',query='',toastTimer,camStream=null,recorder=null,recordedChunks=[];
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const size=n=>{if(!n)return'0 B';let i=0;const u=['B','KB','MB','GB'];while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]};
function say(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2500)}
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}
function all(name){return new Promise((ok,no)=>{let r=store(name).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function put(name,x){return new Promise((ok,no)=>{let r=store(name,'readwrite').put(x);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
function remove(name,id){return new Promise((ok,no)=>{let r=store(name,'readwrite').delete(id);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
function initDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(MEDIA))d.createObjectStore(MEDIA,{keyPath:'id'});if(!d.objectStoreNames.contains(FOLDERS))d.createObjectStore(FOLDERS,{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function refresh(){[folders,files]=await Promise.all([all(FOLDERS),all(MEDIA)]);files=files.map(f=>({...f,folder:f.folder??f.folderId??null,added:f.added??f.addedAt??Date.now()}));folders.sort((a,b)=>a.name.localeCompare(b.name));files.sort((a,b)=>b.added-a.added);render()}
function fname(id){return folders.find(f=>f.id===id)?.name||'Unfiled'}
function render(){
 document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
 $('folderSection').classList.toggle('hidden',!!folderId||view!=='all');
 $('crumb').innerHTML=folderId?`<button data-root>All files</button><span>/</span><button>${esc(fname(folderId))}</button>`:'<button data-root>All files</button>';
 $('filesTitle').textContent=folderId?fname(folderId).toUpperCase():view==='all'?'FILES':view==='image'?'IMAGES':'VIDEOS';
 $('folderCount').textContent=folders.length;$('fileCount').textContent=visibleFiles().length+' items';
 $('folders').innerHTML=folders.length?folders.map(f=>`<div class="folder" data-open="${f.id}"><span class="folder-icon">▰</span><div class="folder-name"><strong>${esc(f.name)}</strong><small>${files.filter(x=>x.folder===f.id).length} items</small></div><button class="folder-menu" title="Folder options" data-menu="${f.id}">···</button></div>`).join(''):`<div class="empty"><strong>No folders</strong>Create one to organize your media.</div>`;
 const list=visibleFiles();$('files').innerHTML=list.length?list.map(f=>`<article class="file"><div class="preview" data-preview="${f.id}">${f.type==='image'?`<img loading="lazy" src="${URL.createObjectURL(f.blob)}" alt="${esc(f.name)}">`:`<video preload="metadata" src="${URL.createObjectURL(f.blob)}"></video><span class="play">▶</span>`}</div><div class="file-info"><div class="filename" title="${esc(f.name)}">${esc(f.name)}</div><div class="meta">${size(f.size)}</div><div class="file-actions"><button data-preview="${f.id}">Open</button><button data-export-file="${f.id}">Code</button><button class="danger" data-delete="${f.id}">Delete</button></div></div></article>`).join(''):`<div class="empty"><strong>${query?'No matches':'Nothing here yet'}</strong>${query?'Try a different search.':'Upload media or import a folder export.'}</div>`;
}
function visibleFiles(){return files.filter(f=>(!folderId||f.folder===folderId)&&(view==='all'||f.type===view)&&f.name.toLowerCase().includes(query.toLowerCase()))}
function showModal(s){$('modal').innerHTML=s;$('backdrop').classList.remove('hidden')}function stopCamera(){if(recorder&&recorder.state!=='inactive'){try{recorder.stop()}catch(e){}}if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}}function close(){stopCamera();$('backdrop').classList.add('hidden');$('modal').innerHTML=''}
$('backdrop').onclick=e=>{if(e.target===$('backdrop'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function newFolder(){showModal(`<h2>New folder</h2><p>Give your folder a name.</p><label for="name">Name</label><input id="name" maxlength="80" placeholder="Folder name"><div class="modal-actions"><button data-close>Cancel</button><button class="primary" id="save">Create</button></div>`);$('name').focus();$('save').onclick=async()=>{let name=$('name').value.trim();if(!name)return say('Enter a folder name.');if(folders.some(f=>f.name.toLowerCase()===name.toLowerCase()))return say('That folder already exists.');let f={id:uid(),name};await put(FOLDERS,f);folderId=f.id;view='all';close();await refresh()};$('name').onkeydown=e=>{if(e.key==='Enter')$('save').click()}}
async function upload(list){let n=0;for(const x of list){if(!x.type.startsWith('image/')&&!x.type.startsWith('video/'))continue;try{await put(MEDIA,{id:uid(),name:x.name,blob:x,type:x.type.startsWith('image/')?'image':'video',mime:x.type,size:x.size,added:Date.now(),addedAt:Date.now(),folder:folderId,folderId:folderId});n++}catch(e){say('Browser storage limit reached. Export some files first.');break}}await refresh();if(n)say(`Added ${n} file${n===1?'':'s'}.`)}
async function openCamera(mode){
 if(!navigator.mediaDevices?.getUserMedia){say('Camera access needs a modern browser on HTTPS or localhost.');return}
 showModal(`<h2>${mode==='photo'?'Take a photo':'Record a video'}</h2><p>Allow camera and microphone access when your browser asks.</p><div style="background:#080808;border-radius:8px;overflow:hidden"><video id="cameraPreview" autoplay playsinline muted style="display:block;width:100%;max-height:55vh;object-fit:contain"></video></div><div id="cameraStatus" class="notice">Starting camera…</div><div class="modal-actions" style="justify-content:space-between"><button data-close>Cancel</button><div style="display:flex;gap:7px"><button id="cameraAction" class="primary" disabled>${mode==='photo'?'Take photo':'Start recording'}</button><button id="stopRecording" class="danger hidden">Stop & save</button></div></div>`);
 try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:mode==='video'});const v=$('cameraPreview');if(!v)return;v.srcObject=camStream;$('cameraStatus').textContent=mode==='photo'?'Camera ready. Press Take photo to save it to your vault.':'Camera ready. Start recording, then stop to save the video.';$('cameraAction').disabled=false;
 if(mode==='photo'){$('cameraAction').onclick=async()=>{const video=$('cameraPreview');if(!video.videoWidth)return say('Camera is not ready yet.');const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.92));if(!blob)return say('Could not take photo.');const stamp=new Date().toISOString().replace(/[:.]/g,'-');await upload([new File([blob],`IMG_${stamp}.jpg`,{type:'image/jpeg'})]);close()}}
 else{$('cameraAction').onclick=()=>{try{const types=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';recordedChunks=[];recorder=new MediaRecorder(camStream,mime?{mimeType:mime}:undefined);recorder.ondataavailable=e=>{if(e.data&&e.data.size)recordedChunks.push(e.data)};recorder.onerror=()=>say('Recording failed.');recorder.onstop=async()=>{if(!recordedChunks.length)return;const blob=new Blob(recordedChunks,{type:recorder.mimeType||'video/webm'});const stamp=new Date().toISOString().replace(/[:.]/g,'-');await upload([new File([blob],`VID_${stamp}.webm`,{type:blob.type})]);close()};recorder.start();$('cameraAction').classList.add('hidden');$('stopRecording').classList.remove('hidden');$('cameraStatus').textContent='Recording… Press Stop & save when finished.'}catch(e){say('Could not start recording: '+e.message)}};$('stopRecording').onclick=()=>{if(recorder&&recorder.state!=='inactive')recorder.stop()}}
 }catch(e){$('cameraStatus').textContent='Could not access the camera or microphone. Check browser permissions and make sure the page is running on HTTPS or localhost.';$('cameraAction').disabled=true;say(e.name==='NotAllowedError'?'Camera permission was denied. Allow access in browser settings.':'Camera error: '+e.message)}
}
function folderOptions(id){let f=folders.find(x=>x.id===id);if(!f)return;showModal(`<h2>${esc(f.name)}</h2><p>${files.filter(x=>x.folder===id).length} items</p><div class="modal-actions" style="justify-content:space-between"><button class="danger" id="delFolder">Delete folder</button><div style="display:flex;gap:6px"><button data-close>Cancel</button><button id="rename">Rename</button><button class="primary" id="export">Export</button></div></div><div class="notice">Deleting a folder keeps its files and moves them to All files.</div>`);$('rename').onclick=()=>renameFolder(id);$('export').onclick=()=>exportFolder(id);$('delFolder').onclick=async()=>{if(!confirm(`Delete "${f.name}"? Its files will be kept.`))return;for(let x of files.filter(x=>x.folder===id)){x.folder=null;x.folderId=null;await put(MEDIA,x)}await remove(FOLDERS,id);if(folderId===id)folderId=null;close();await refresh()}}
function renameFolder(id){let f=folders.find(x=>x.id===id);showModal(`<h2>Rename folder</h2><label for="newname">Name</label><input id="newname" maxlength="80" value="${esc(f.name)}"><div class="modal-actions"><button data-close>Cancel</button><button class="primary" id="saveName">Save</button></div>`);$('saveName').onclick=async()=>{let n=$('newname').value.trim();if(!n)return say('Enter a name.');if(folders.some(x=>x.id!==id&&x.name.toLowerCase()===n.toLowerCase()))return say('That folder name is taken.');f.name=n;await put(FOLDERS,f);close();await refresh()}}
async function deleteFile(id){let f=files.find(x=>x.id===id);if(!f||!confirm(`Delete "${f.name}" from this browser?`))return;await remove(MEDIA,id);await refresh();say('File deleted.')}
function preview(id){let f=files.find(x=>x.id===id);if(!f)return;let u=URL.createObjectURL(f.blob);showModal(`<div class="viewer-head"><h2>${esc(f.name)}</h2><button data-close>Close</button></div><div class="viewer">${f.type==='image'?`<img src="${u}" alt="${esc(f.name)}">`:`<video src="${u}" controls autoplay></video>`}</div><p style="margin:10px 0 0">${esc(fname(f.folder))} · ${size(f.size)}</p>`)}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function toB64(blob){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=()=>no(r.error);r.readAsDataURL(blob)})}
function fromB64(s,type){let raw=atob(s),parts=[];for(let i=0;i<raw.length;i+=8192){let chunk=raw.slice(i,i+8192),a=new Uint8Array(chunk.length);for(let j=0;j<chunk.length;j++)a[j]=chunk.charCodeAt(j);parts.push(a)}return new Blob(parts,{type:type||'application/octet-stream'})}
async function exportFolder(id){let f=folders.find(x=>x.id===id);if(!f)return;let payload={format:'MEDIA_VAULT_EXPORT',version:1,folder:{name:f.name},files:[]};say('Preparing export…');for(let x of files.filter(x=>x.folder===id))payload.files.push({name:x.name,type:x.type,mime:x.mime,size:x.size,added:x.added,data:await toB64(x.blob)});download(new Blob([JSON.stringify(payload)],{type:'application/json'}),`${f.name.replace(/[^a-z0-9-_ ]/gi,'').trim()||'folder'}.vault.json`);close();say('Export downloaded. Share the .vault.json file.')}
function bytesToB64Url(bytes){let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64UrlToBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);const bin=atob(s),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
async function gzipBytes(bytes){if(!('CompressionStream'in window))throw Error('This browser does not support compressed codes. Use Edge or Chrome.');const stream=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));return new Uint8Array(await new Response(stream).arrayBuffer())}
async function gunzipBytes(bytes){if(!('DecompressionStream'in window))throw Error('This browser does not support compressed codes. Use Edge or Chrome.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return new Uint8Array(await new Response(stream).arrayBuffer())}
async function exportFileCode(id){const f=files.find(x=>x.id===id);if(!f)return;try{say('Packing file into a compact code…');const payload={v:1,n:f.name,t:f.type,m:f.mime||f.blob.type,d:await toB64(f.blob)};const compressed=await gzipBytes(new TextEncoder().encode(JSON.stringify(payload)));const code='MV1-'+bytesToB64Url(compressed);showModal(`<h2>Export file code</h2><p>Copy this code and paste it into Import on another Media Vault. Compression keeps it as short as practical.</p><textarea id="exportCode" readonly style="width:100%;min-height:130px;resize:vertical;background:#101010;color:#ddd;border:1px solid var(--line);border-radius:7px;padding:10px;font:11px/1.45 ui-monospace,monospace"></textarea><div class="notice" id="codeLength"></div><div class="modal-actions"><button data-close>Close</button><button class="primary" id="copyCode">Copy code</button></div>`);$('exportCode').value=code;$('codeLength').textContent=`${code.length.toLocaleString()} characters. Media must be included in a portable code, so videos can still create long codes.`;$('copyCode').onclick=async()=>{try{await navigator.clipboard.writeText(code);say('Code copied.')}catch{const el=$('exportCode');el.select();document.execCommand('copy');say('Code selected/copied where supported.')}}}catch(e){say(e.message||'Could not create code.')}}
async function importCode(raw){let code=raw.trim();if(!code.startsWith('MV1-'))throw Error('That does not look like a Media Vault file code.');const packed=b64UrlToBytes(code.slice(4));const payload=JSON.parse(new TextDecoder().decode(await gunzipBytes(packed)));if(payload.v!==1||typeof payload.n!=='string'||typeof payload.d!=='string')throw Error('Unsupported or invalid file code.');const blob=fromB64(payload.d,payload.m);const f={id:uid(),name:payload.n,blob,type:payload.t==='video'?'video':'image',mime:payload.m||blob.type,size:blob.size,added:Date.now(),addedAt:Date.now(),folder:folderId||null,folderId:folderId||null};await put(MEDIA,f);await refresh()}
function importFolder(){showModal(`<h2>Import</h2><p>Import a folder export file or paste a single image/video code.</p><label for="importFile">Folder export file</label><input id="importFile" type="file" accept=".json,.vault.json,application/json"><label for="importCode">Single-file code</label><textarea id="importCode" placeholder="Paste an MV1- code here…" style="width:100%;min-height:90px;resize:vertical;background:#101010;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:10px;font:11px/1.45 ui-monospace,monospace"></textarea><div class="notice">Codes are compressed, but the media itself must still be included. Large videos can produce long codes.</div><div class="modal-actions"><button data-close>Cancel</button><button class="primary" id="doImport">Import</button></div>`);$('doImport').onclick=async()=>{const file=$('importFile').files[0],code=$('importCode').value.trim();try{if(code){await importCode(code);close();say('File code imported.');return}if(!file)return say('Choose an export file or paste a code.');const p=JSON.parse(await file.text());if(p.format!=='MEDIA_VAULT_EXPORT'||p.version!==1||!p.folder||!Array.isArray(p.files))throw Error('Unsupported export file');let base=String(p.folder.name||'Imported folder').slice(0,80),name=base,n=2;while(folders.some(f=>f.name.toLowerCase()===name.toLowerCase()))name=`${base} (${n++})`;const f={id:uid(),name};await put(FOLDERS,f);let count=0;for(const x of p.files){if(typeof x.data!=='string'||typeof x.name!=='string')continue;const b=fromB64(x.data,x.mime);await put(MEDIA,{id:uid(),name:x.name,blob:b,type:x.type==='video'?'video':'image',mime:x.mime||b.type,size:b.size,added:x.added||Date.now(),addedAt:x.added||Date.now(),folder:f.id,folderId:f.id});count++}folderId=f.id;view='all';close();await refresh();say(`Imported ${count} file${count===1?'':'s'}.`)}catch(e){say('Import failed: '+e.message)}}}
document.addEventListener('click',e=>{let t=e.target.closest('button,[data-open],[data-preview]');if(!t)return;if(t.hasAttribute('data-close')){close();return}if(t.hasAttribute('data-root')){folderId=null;view='all';render();return}if(t.dataset.view){view=t.dataset.view;folderId=null;render();return}if(t.dataset.open){folderId=t.dataset.open;view='all';render();return}if(t.dataset.menu){folderOptions(t.dataset.menu);return}if(t.dataset.preview){preview(t.dataset.preview);return}if(t.dataset.exportFile){exportFileCode(t.dataset.exportFile);return}if(t.dataset.delete){deleteFile(t.dataset.delete)}});
$('folders').addEventListener('click',e=>{let t=e.target.closest('[data-open]');if(t&&!e.target.closest('[data-menu]')){folderId=t.dataset.open;view='all';render()}});
$('newFolder').onclick=newFolder;$('takePhoto').onclick=()=>openCamera('photo');$('recordVideo').onclick=()=>openCamera('video');$('upload').onclick=()=>$('picker').click();$('picker').onchange=async e=>{await upload([...e.target.files]);e.target.value=''};$('import').onclick=importFolder;$('search').oninput=e=>{query=e.target.value;render()};
(async()=>{try{db=await initDB();await refresh()}catch(e){console.error(e);say('Browser storage is unavailable in this browser.')}})();
})();
</script>
